<!DOCTYPE html>
<html>

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="16x16" href="https://cheepfish.neocities.org/png/icon4tab.png">
    <title>gone fishin'</title>
    <link href="_css/stylefont.css" rel="stylesheet" type="text/css" media="all">
  </head>

  <style>
    body {
        background-image: url(https://cheepfish.neocities.org/shrine/SHRINEbg4.jpg);
        background-attachment: fixed;
        background-size: cover;
    }

    main {
        width: 100%;
        margin: auto;
    }

    a {
        text-decoration: none;
        color: rgb(0, 0, 0);
    }

    h1 {
        text-align: center;
        font-size: 6em;
        font-family: "Pixelout";
        color: rgb(4, 5, 43);
        background: linear-gradient(to top, #59ffff, #b1ff58,#e5ff51, #ffffe2);
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
        width: 10em;
        margin: auto;
        margin-top: 0.5em;
        margin-bottom: 0.3em;
        filter: drop-shadow(0.7vw 0.7vw rgb(11, 40, 43));
    }

    h2 {
        text-align: center;
        font-family: "pixel";
        color: aliceblue;
        font-size: 1.1em;
        margin-top: 2em;
        border-radius: 45px;
    }

    .shrines {
        display: flex;
        gap: 7em;
        align-items: center;
        justify-content: center;
    }

    .both {
        width: fit-content;
    }

    .both img {
        width: 10em;
    }
    
    .back {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        background-color: aliceblue;
        border-radius: 150px;
        width: 12em;
        height: 12em;
        position: relative;
    }

    .back:hover {
        background-color: #dbff0c;
    }

    .back img:hover {
        filter: drop-shadow(0.5em 0.5em rgb(18, 179, 152));
    }

    .spiderman, .splatoon, .nin {
        filter: grayscale(100%);
        
    }
    
    .cross {
        text-decoration: line-through;
    }


@media screen and (max-width: 1024px) {
    .back {
        width: 9em;
        height: 9em;
    }

    .both img {
        width: 7em;
    }

    .shrines {
        flex-wrap: wrap;
    }

    h1 {
        font-size: 4em;
    }

    h2 {
        font-size: 1em;
    }
}

@media screen and (max-width: 600px) {
  .shrines {
    flex-direction: column;
    gap: 2em;
  }

  h1 {
    font-size: 1.2em;
    margin: 0 auto;
    margin-bottom: 0.7em;
  }

  h2 {
    font-size: 0.8em;
  }

  .back {
        width: 6em;
        height: 6em;
    }

    .both img {
        width:4em;
    }
  
}


  </style>

  <body>
    <main>
        <div class="title">
            <h1>S H R I N E S</h1>
        </div>
        <div class="shrines">
            <div class="both">
                <a href="SHRINEgenshinimpact.html">
                    <div class="back"><img loading="lazy" class="genshin" src="https://cheepfish.neocities.org/shrine/SHRINEgenshin.gif"></div></a>
                    <h2>Genshin Impact</h2>
            </div>
               
            <div class="both">
                <a href="404.html">
                    <div class="back"><img loading="lazy" class="spiderman" src="https://cheepfish.neocities.org/shrine/SHRINEspiderman.gif"></div></a>
                    <h2 class="cross">Spiderman</h2>
            </div>

            <div class="both">
                <a href="404.html">
                    <div class="back"><img loading="lazy" class="splatoon" src="https://cheepfish.neocities.org/shrine/SHRINEsplatoon.gif"></div></a>
                    <h2 class="cross">Splatoon</h2>
            </div>

            <div class="both">
                <a href="404.html">
                    <div class="back"><img loading="lazy" class="nin" src="https://cheepfish.neocities.org/shrine/SHRINEnin.gif"></div></a>
                    <h2 class="cross">Nine Inch Nails</h2>
            </div>
        </div>
    </main>
  </body>
